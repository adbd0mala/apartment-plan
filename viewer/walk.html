<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
html,body{margin:0;background:#000;overflow:hidden;width:1280px;height:720px}
canvas{display:block}
#cap{position:fixed;right:28px;bottom:28px;font:600 30px/1.3 "DejaVu Sans",sans-serif;color:#fff;background:rgba(20,20,20,.62);padding:10px 20px;border-radius:12px;direction:rtl}
#sub{position:fixed;right:28px;bottom:92px;font:400 18px/1.3 "DejaVu Sans",sans-serif;color:#fff;background:rgba(20,20,20,.5);padding:6px 14px;border-radius:10px;direction:rtl}
#brand{position:fixed;left:24px;top:20px;font:400 16px "DejaVu Sans",sans-serif;color:rgba(255,255,255,.75)}
#cap:empty,#sub:empty{display:none}
</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<canvas id="c"></canvas><div id="cap"></div><div id="sub"></div><div id="brand">جولة داخل الشقة – مرحلة المباني · ارتفاع العين 1.60 م</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const W = 1280, H = 720;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, preserveDrawingBuffer:true});
renderer.setSize(W, H, false); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xdfe8f0);
scene.fog = new THREE.Fog(0xdfe8f0, 18, 40);
const camera = new THREE.PerspectiveCamera(68, W/H, 0.05, 100);
scene.add(new THREE.HemisphereLight(0xfff4e6, 0x8a8478, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.4); sun.position.set(10, 16, 6); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); const s = 12; Object.assign(sun.shadow.camera, {left:-s, right:s, top:s, bottom:-s, near:1, far:60}); sun.shadow.bias = -0.0005; scene.add(sun);
// soft interior fill lights (ceiling-level)
for (const [x,y] of [[1.75,2.3],[5.4,2.5],[-3.3,3.0],[-3.9,0.3],[-1.2,0.7]]) { const pl = new THREE.PointLight(0xfff1dc, 0.35, 9, 1.6); pl.position.set(x, 2.7, -y); scene.add(pl); }
const root = new THREE.Group(); root.rotation.x = -Math.PI/2; scene.add(root);
const COL = {wall_ext:0xd9d4ca, wall_int:0xe8e4da, column:0x6a6a66, parapet:0xcbbfa6, floor:0xd8cfbf, floor_wet:0xb9cfdc, floor_balcony:0xc9c2b4, slab:0xb4b4b0};
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({color:0xb9b3a6, roughness:1})); ground.rotation.x = -Math.PI/2; ground.position.y = -0.13; ground.receiveShadow = true; scene.add(ground);
// brick-ish texture via canvas for walls
function brickTex(base, mortar, scale){ const c = document.createElement('canvas'); c.width = 512; c.height = 256; const g = c.getContext('2d');
  g.fillStyle = mortar; g.fillRect(0,0,512,256); const bw = 64, bh = 32;
  for (let r = 0; r < 8; r++) for (let i = -1; i < 9; i++) { const off = (r % 2) * bw/2; const v = (Math.random()*18-9)|0;
    g.fillStyle = `rgb(${base[0]+v},${base[1]+v},${base[2]+v})`; g.fillRect(i*bw+off+2, r*bh+2, bw-4, bh-4); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(scale, scale/2); t.colorSpace = THREE.SRGBColorSpace; return t; }
const extTex = brickTex([176,96,78], "#a99f93", 2.2), intTex = brickTex([186,106,88], "#b0a79b", 2.2);
await new Promise(res => new GLTFLoader().load('apartment_3d.glb', g => {
  g.scene.traverse(o => { if (o.isMesh) { if (!o.geometry.attributes.normal) o.geometry.computeVertexNormals(); let n=o.name, p=o; while (p && !(n in COL)) { p=p.parent; n=p?p.name:''; }
    const isWall = n === 'wall_ext' || n === 'wall_int';
    o.material = new THREE.MeshStandardMaterial({color: isWall ? 0xffffff : (COL[n] ?? 0xdddddd), map: n==='wall_ext'?extTex:(n==='wall_int'?intTex:null), roughness:.95, metalness:0});
    if (isWall) { // planar UVs so bricks tile by world size
      const pos = o.geometry.attributes.position, uv = new Float32Array(pos.count*2), nor = o.geometry.attributes.normal;
      for (let i=0;i<pos.count;i++){ const nx=Math.abs(nor.getX(i)), ny=Math.abs(nor.getY(i)); const u = nx>0.5 ? pos.getY(i) : pos.getX(i); const v = (nx>0.5||ny>0.5) ? pos.getZ(i) : pos.getY(i); uv[2*i]=u; uv[2*i+1]=v; }
      o.geometry.setAttribute('uv', new THREE.BufferAttribute(uv, 2)); }
    o.castShadow = true; o.receiveShadow = true; } });
  root.add(g.scene); res();
}));
// ceilings per room (thin slabs at 3.00) so interiors read as rooms
const ROOMS = [[0.0, 0.0, 3.5, 4.7], [3.6, 0.35, 7.15, 4.7], [-5.25, 1.45, -1.35, 4.7], [-5.25, -0.8, -2.55, 1.35], [-1.25, 1.45, -0.1, 3.55], [-2.45, 0.0, 0.0, 1.35], [-2.45, -1.45, -1.45, 0.0]];
for (const r of ROOMS) { const [x1,y1,x2,y2] = r; const m = new THREE.Mesh(new THREE.BoxGeometry(x2-x1+0.3, 0.05, y2-y1+0.3), new THREE.MeshStandardMaterial({color:0xe6e2da, emissive:0x3a3834, roughness:1})); m.position.set((x1+x2)/2, 3.025, -(y1+y2)/2); m.receiveShadow = true; scene.add(m); }
window.setCam = (px, py, pz, tx, ty, tz, cap, sub) => {
  camera.position.set(px, pz, -py); camera.lookAt(tx, tz, -ty); renderer.render(scene, camera);
  document.getElementById('cap').textContent = cap || ''; document.getElementById('sub').textContent = sub || '';
};
window.ready = true;
</script></body></html>
