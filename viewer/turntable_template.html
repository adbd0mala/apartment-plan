<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>مجسم الشقة</title>
<style>
:root{--bg:#f4f2ee;--fg:#1d1d1b;--muted:#6b6b66;--panel:rgba(255,255,255,.92);--line:#d9d6cf;--accent:#1f4e79}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1b1b1a;--fg:#ececea;--muted:#a3a39d;--panel:rgba(32,32,31,.92);--line:#3a3a38;--accent:#7fb2e6}}
:root[data-theme="dark"]{--bg:#1b1b1a;--fg:#ececea;--muted:#a3a39d;--panel:rgba(32,32,31,.92);--line:#3a3a38;--accent:#7fb2e6}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,Tahoma,Arial,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none}
#img{max-width:100%;max-height:100%;width:auto;height:auto;pointer-events:none;border-radius:8px}
.panel{position:fixed;top:12px;right:12px;left:12px;max-width:520px;margin-inline-start:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;z-index:2}
h1{font-size:16px;margin:0 0 2px} .sub{font-size:12px;color:var(--muted);margin:0}
.bar{position:fixed;bottom:14px;left:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;z-index:2}
button{font:inherit;font-size:14px;padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#deg{position:fixed;bottom:66px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted);z-index:2}
</style></head><body>
<div class="panel"><h1>مجسم الشقة – مرحلة المباني</h1><p class="sub">اسحب بإصبعك يمين/شمال عشان يلف · 36 زاوية · بيشتغل على أي موبايل</p></div>
<div id="stage"><img id="img" alt="مجسم الشقة"></div>
<div id="deg"></div>
<div class="bar">
  <button id="bFull" class="on">حوائط كاملة</button>
  <button id="bCut">مقطوع 1.20 م</button>
  <button id="bTop">من فوق</button>
  <button id="bSpin">لف تلقائي</button>
</div>
<script>
const F = __FRAMES__;
const img = document.getElementById('img'), stage = document.getElementById('stage'), degEl = document.getElementById('deg');
let mode = 'normal', idx = 0, spin = null;
function show(){ img.src = mode === 'top' ? F.top : F[mode][((idx % 36) + 36) % 36]; degEl.textContent = mode === 'top' ? 'منظر علوي' : 'زاوية ' + (((idx % 36) + 36) % 36) * 10 + '°'; }
function setMode(m, btn){ mode = m; for (const id of ['bFull','bCut','bTop']) document.getElementById(id).classList.remove('on'); document.getElementById(btn).classList.add('on'); show(); }
document.getElementById('bFull').onclick = () => setMode('normal','bFull');
document.getElementById('bCut').onclick = () => setMode('cut','bCut');
document.getElementById('bTop').onclick = () => setMode('top','bTop');
document.getElementById('bSpin').onclick = e => { if (spin) { clearInterval(spin); spin = null; e.target.classList.remove('on'); } else { if (mode==='top') setMode('normal','bFull'); spin = setInterval(() => { idx++; show(); }, 120); e.target.classList.add('on'); } };
let dragging = false, lastX = 0, acc = 0;
const start = x => { dragging = true; lastX = x; acc = 0; if (spin) document.getElementById('bSpin').click(); if (mode==='top') setMode('normal','bFull'); };
const move = x => { if (!dragging) return; acc += x - lastX; lastX = x; const step = Math.max(8, stage.clientWidth / 60); while (acc > step) { idx--; acc -= step; show(); } while (acc < -step) { idx++; acc += step; show(); } };
stage.addEventListener('pointerdown', e => { start(e.clientX); stage.setPointerCapture(e.pointerId); });
stage.addEventListener('pointermove', e => move(e.clientX));
stage.addEventListener('pointerup', () => dragging = false); stage.addEventListener('pointercancel', () => dragging = false);
addEventListener('keydown', e => { if (e.key==='ArrowLeft') { idx--; show(); } if (e.key==='ArrowRight') { idx++; show(); } });
// preload
for (const k of ['normal','cut']) for (const s of F[k]) { const i = new Image(); i.src = s; }
show();
</script></body></html>
