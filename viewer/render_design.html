<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body><canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
RectAreaLightUniformsLib.init();
const q = new URLSearchParams(location.search);
const W = +q.get('w')||1600, H = +q.get('h')||1000;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, preserveDrawingBuffer:true});
renderer.setSize(W, H, false); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.85;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xcfd8e2);
const camera = new THREE.PerspectiveCamera(62, W/H, 0.05, 100);
const design = await (await fetch('design.json')).json();
const geo = await (await fetch('geometry.json')).json();
const ROOMS = geo.ROOMS;
const fin = (k) => Object.assign({floor:"none", paint:"#f5f1e8", tileH:0, ceil:"#ffffff"}, (design.finishes||{})[k]||{});
// ---------- textures ----------
function texCanvas(fn, w=512, h=512, rep=[1,1]){ const c=document.createElement('canvas'); c.width=w; c.height=h; fn(c.getContext('2d'), w, h); const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rep[0],rep[1]); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t; }
function tileTex(base, grout, tw, th, kind){ // one texture = 2x2 tiles, repeat per metre
  return texCanvas((g,w,h)=>{ g.fillStyle=grout; g.fillRect(0,0,w,h); const cw=w/2, ch=h/2, gap=Math.max(2,w*0.006);
    let seed=7; const rnd=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
    for (let i=0;i<2;i++) for (let j=0;j<2;j++){ const x=i*cw, y=j*ch; const v=0.95+rnd()*0.1; g.fillStyle=shadeHex(base,v); g.fillRect(x+gap/2,y+gap/2,cw-gap,ch-gap);
      if (kind==="marble"){ g.save(); g.beginPath(); g.rect(x,y,cw,ch); g.clip(); g.strokeStyle="rgba(120,115,105,.35)"; g.lineWidth=2; for (let k=0;k<4;k++){ g.beginPath(); let px=x+rnd()*cw, py=y; g.moveTo(px,py); for (let t=0;t<6;t++){ px+=(rnd()-0.5)*cw*0.4; py+=ch/6; g.quadraticCurveTo(px+(rnd()-0.5)*cw*0.3,py-ch/12,px,py); } g.stroke(); } g.restore(); }
      if (kind==="wood"){ g.save(); g.beginPath(); g.rect(x,y,cw,ch); g.clip(); g.strokeStyle="rgba(50,25,5,.22)"; g.lineWidth=1.5; for (let k=0;k<10;k++){ const yy=y+ch*(k+0.5)/10; g.beginPath(); g.moveTo(x,yy); g.bezierCurveTo(x+cw*0.3,yy+(rnd()-0.5)*8,x+cw*0.7,yy+(rnd()-0.5)*8,x+cw,yy); g.stroke(); } g.restore(); } }
  }, 512, 512, [1/(2*tw), 1/(2*th)]); }
function shadeHex(hex,f){ const n=parseInt(hex.slice(1),16); const r=Math.min(255,((n>>16)&255)*f)|0, g=Math.min(255,((n>>8)&255)*f)|0, b=Math.min(255,(n&255)*f)|0; return `rgb(${r},${g},${b})`; }
const FLOORS = {none:["#d9d4c9","#c9c4b9",0.6,0.6,"plain"], porc60w:["#f0eee9","#d5d2cb",0.6,0.6,"plain"], porc60:["#e4dccd","#cbc3b4",0.6,0.6,"plain"], porc60g:["#c6c6c3","#a9a9a6",0.6,0.6,"plain"], porc80:["#ebe8e1","#d2cfc8",0.8,0.8,"marble"], porc120:["#e6e2da","#cfcbc3",0.6,1.2,"marble"], marbleb:["#2e2e30","#3a3a3c",0.8,0.8,"marble"], marbleg:["#d9d9d7","#bfbfbd",0.6,0.6,"marble"], wood:["#a9774b","#8d5f37",0.2,1.2,"wood"], woodl:["#cfa678","#b58b5f",0.2,1.2,"wood"], woodg:["#a89f93","#8a8176",0.2,1.2,"wood"], hdf:["#c89a67","#a97f52",0.19,1.2,"wood"], terr:["#e3ded4","#cdc8be",0.6,0.6,"plain"], cem:["#b9b6ae","#a19e96",0.8,0.8,"plain"], moroc:["#e9e3d6","#cfc8ba",0.2,0.2,"plain"], hex:["#dcd7cc","#b9b4a9",0.23,0.23,"plain"], cer30:["#cfd9d9","#aab6b6",0.3,0.3,"plain"], cer40:["#d5d0c4","#b8b3a7",0.4,0.4,"plain"], cer25w:["#f2f2f0","#d9d9d6",0.25,0.4,"plain"], cer25b:["#e8dfcf","#cfc5b3",0.25,0.4,"plain"], subway:["#f4f4f2","#c9c9c6",0.075,0.15,"plain"], wmarble:["#eae7e0","#d0cdc6",0.6,1.2,"marble"]};
function floorMat(k){ const f=fin(k); let def=FLOORS[f.floor]||FLOORS.none; if (f.floor==="custom" && f.custom){ def=[f.custom.c||"#e0dcd2", f.custom.g||"#c4bfb4", f.custom.tile||0.6, f.custom.tile2||f.custom.tile||0.6, "plain"]; }
  const m=new THREE.MeshStandardMaterial({map: tileTex(def[0],def[1],def[2],def[3],def[4]), roughness: def[4]==="wood"?0.7:0.35, metalness:0}); return m; }
// ---------- shell ----------
const paintMat = (hex) => new THREE.MeshStandardMaterial({color:new THREE.Color(hex), roughness:0.92, metalness:0});
const root = new THREE.Group(); root.rotation.x = -Math.PI/2; scene.add(root);
function roomAt(x,y){ for (const k in ROOMS){ const [x1,y1,x2,y2]=ROOMS[k].box; if (x>=x1&&x<=x2&&y>=y1&&y<=y2) return k; } return null; }
// walls: build from WALLS3D boxes (split at tile height for wet rooms) so each face gets its room's paint
const walls3d = await (await fetch('walls3d.json')).json();
for (const [x1,y1,x2,y2,z0,z1,kind] of walls3d){
  const cx=(x1+x2)/2, cy=(y1+y2)/2; const horiz=(x2-x1)>=(y2-y1);
  // colour by the room on each side: make two thin boxes (each half) so faces take their room's paint
  const halves = horiz ? [[x1,y1,x2,cy, 0,-1],[x1,cy,x2,y2, 0,1]] : [[x1,y1,cx,y2, -1,0],[cx,y1,x2,y2, 1,0]];
  for (const [a,b,c,d,nx,ny] of halves){ const k=roomAt((a+c)/2+nx*0.12,(b+d)/2+ny*0.12); const f=k?fin(k):null;
    const segs=[]; if (f && f.tileH>0 && z0<f.tileH){ segs.push([z0,Math.min(z1,f.tileH),"tile"]); if (z1>f.tileH) segs.push([f.tileH,z1,"paint"]); } else segs.push([z0,z1,"paint"]);
    for (const [s0,s1,ty] of segs){ let mat; if (!k) mat=paintMat("#d9d4ca"); else if (ty==="tile"){ const wt=FLOORS[f.wallTileId]||["#cfdfe6","#b7c7ce",0.25,0.4,"plain"]; mat=new THREE.MeshStandardMaterial({map:tileTex(wt[0],wt[1],wt[2],wt[3],wt[4]), roughness:0.3}); } else { const side = Math.abs(nx)>0 ? (nx>0?"left":"right") : (ny>0?"bottom":"top"); const col = (f.accent && f.accent!=="none" && f.accent===side) ? f.accentColor : f.paint; mat=paintMat(col); }
      const m=new THREE.Mesh(new THREE.BoxGeometry(c-a, d-b, s1-s0), mat); m.position.set((a+c)/2,(b+d)/2,(s0+s1)/2); m.castShadow=true; m.receiveShadow=true; root.add(m); } } }
// floors + ceilings
for (const k in ROOMS){ const [x1,y1,x2,y2]=ROOMS[k].box; if (k==="manwar") continue; const fl=new THREE.Mesh(new THREE.PlaneGeometry(x2-x1,y2-y1), floorMat(k)); fl.position.set((x1+x2)/2,(y1+y2)/2,0); fl.receiveShadow=true; root.add(fl);
  if (k!=="balcony"){ const ce=new THREE.Mesh(new THREE.PlaneGeometry(x2-x1,y2-y1), new THREE.MeshStandardMaterial({color:new THREE.Color(fin(k).ceil||"#ffffff"), roughness:0.95})); ce.position.set((x1+x2)/2,(y1+y2)/2,3.0); ce.rotation.x=Math.PI; ce.receiveShadow=true; root.add(ce); } }
// ---------- design items ----------
const LIBH = {bed160:0.5,bed180:0.5,bed120:0.5,bed90:0.5,sofa3:0.85,sofa2:0.85,arm:0.85,dine4:0.75,dine6:0.75,tv:0.6,ward2:2.4,ward3:2.4,ward4:2.4,ward6:2.4,fridge:1.8,cooker60:0.9,sink:0.9,base60:0.9,wc:0.8,basin:0.85,island:0.9};
function prism(pts2, z0, h, color, emissive){ const shape=new THREE.Shape(pts2.map(p=>new THREE.Vector2(p[0],p[1]))); const g=new THREE.ExtrudeGeometry(shape,{depth:h,bevelEnabled:false}); const m=new THREE.Mesh(g, new THREE.MeshStandardMaterial({color:new THREE.Color(color), roughness:0.9, emissive: emissive?new THREE.Color(emissive):0x000000, emissiveIntensity: emissive?1.6:0})); m.position.z=z0; m.castShadow=!emissive; m.receiveShadow=true; return m; }
for (const it of design.items||[]){
  if (it.t==="poly"){ const g=new THREE.Group(); g.position.set(it.x,it.y,0); g.rotation.z=(it.r||0)*Math.PI/180;
    if (it.plane==="wall"){ const shape=new THREE.Shape(it.pts.map(p=>new THREE.Vector2(p[0],p[1]))); const geom=new THREE.ExtrudeGeometry(shape,{depth:it.h||0.1,bevelEnabled:false}); const m=new THREE.Mesh(geom,new THREE.MeshStandardMaterial({color:new THREE.Color(it.c),roughness:0.85})); m.rotation.x=Math.PI/2; m.position.set(0,(it.h||0.1)/2,it.z0||0); m.castShadow=m.receiveShadow=true; g.add(m); }
    else { const isLed = /ليد|led/i.test(it.name||"") || it.c==="#ffe08a"; g.add(prism(it.pts, it.z0||0, it.h||0.1, it.c, isLed?"#ffd27a":null));
      if (isLed){ // شريط إضاءة: RectAreaLight على كل ضلع من المضلع الخارجي، موجه لأعلى نحو السقف
        const pts=it.pts; const outer = pts.slice(0, Math.min(4, pts.length)); // الحلقة: أول 4 نقاط هي الإطار الخارجي
        for (let i=0;i<outer.length;i++){ const a=outer[i], b=outer[(i+1)%outer.length]; const len=Math.hypot(b[0]-a[0],b[1]-a[1]); if (len<0.2) continue;
          const l=new THREE.RectAreaLight(0xffd9a0, 14.0, len, 0.08); l.position.set((a[0]+b[0])/2,(a[1]+b[1])/2,2.86); l.lookAt((a[0]+b[0])/2,(a[1]+b[1])/2,2.86+1); l.rotation.z = Math.atan2(b[1]-a[1], b[0]-a[0]); g.add(l);
          const l2=new THREE.RectAreaLight(0xffd9a0, 3.0, len, 0.06); l2.position.set((a[0]+b[0])/2,(a[1]+b[1])/2,2.84); l2.lookAt((a[0]+b[0])/2,(a[1]+b[1])/2,-5); l2.rotation.z=l.rotation.z; g.add(l2); } } }
    root.add(g); continue; }
  const w=it.w||1, d=it.d||1, h=it.h||LIBH[it.t]||0.5, z0=it.z0||0; const m=new THREE.Mesh(new THREE.BoxGeometry(w,d,h), new THREE.MeshStandardMaterial({color:new THREE.Color(it.c||"#b9b4aa"), roughness:0.8})); m.position.set(it.x,it.y,z0+h/2); m.rotation.z=(it.r||0)*Math.PI/180; m.castShadow=m.receiveShadow=true; root.add(m); }
// ---------- lights ----------
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8478, 0.3));
const sun=new THREE.DirectionalLight(0xfff2dd, 0.8); sun.position.set(-6,10,4); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048); const s=10; Object.assign(sun.shadow.camera,{left:-s,right:s,top:s,bottom:-s,near:1,far:40}); sun.shadow.bias=-0.0004; scene.add(sun);
// window light into living (منور) and kids (balcony)
for (const [x,y,z] of [[-0.05,4.15,2.0],[7.2,3.3,1.8],[-4.05,-0.9,2.0]]){ const l=new THREE.PointLight(0xdfeaff, 1.0, 7, 1.5); l.position.set(x,z,-y); scene.add(l); }
// ---------- composer ----------
const composer = new EffectComposer(renderer); composer.setSize(W,H); composer.addPass(new RenderPass(scene,camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W,H), 0.28, 0.5, 0.92); composer.addPass(bloom); composer.addPass(new OutputPass());
window.shot = (px,py,pz,tx,ty,tz,fov) => { camera.fov=fov||62; camera.updateProjectionMatrix(); camera.position.set(px,pz,-py); camera.lookAt(tx,tz,-ty); composer.render(); return true; };
window.ready = true;
</script></body></html>
