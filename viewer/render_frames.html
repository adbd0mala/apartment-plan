<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#f4f2ee;overflow:hidden}canvas{display:block}</style>

</head><body><canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';

const W = 1000, H = 700;

</script></body></html>
