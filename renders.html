<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>تصوّر بذوقك</title>
<style>:root{--bg:#f4f2ee;--fg:#1d1d1b;--muted:#6b6b66;--line:#d9d6cf}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1b1b1a;--fg:#ececea;--muted:#a3a39d;--line:#3a3a38}}:root[data-theme="dark"]{--bg:#1b1b1a;--fg:#ececea;--muted:#a3a39d;--line:#3a3a38}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font-family:system-ui,Tahoma,Arial,sans-serif;max-width:1100px;margin-inline:auto}h1{font-size:18px;margin:0 0 4px}p{color:var(--muted);font-size:13px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}figure{margin:0}img{width:100%;border-radius:10px;border:1px solid var(--line)}figcaption{font-size:12px;color:var(--muted);margin-top:4px}a{color:inherit}</style></head><body>
