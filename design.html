<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>صمّم الشقة</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1f4e79"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<style>

  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1b1b1a;--fg:#ececea;--muted:#a3a39d;--panel:#242423;--line:#3a3a38;--accent:#7fb2e6;--accent2:#f0944d;--ok:#68d391}}
  :root[data-theme="dark"]{--bg:#1b1b1a;--fg:#ececea;--muted:#a3a39d;--panel:#242423;--line:#3a3a38;--accent:#7fb2e6;--accent2:#f0944d;--ok:#68d391}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;overflow:hidden;overscroll-behavior:none}
  #app{display:flex;flex-direction:column;height:100%}
  header{display:flex;align-items:center;gap:5px;padding:6px 8px;flex-wrap:nowrap;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--line)}
  header h1{font-size:15px;margin:0;flex:1;white-space:nowrap;min-width:70px}
  .tabs{display:flex;gap:4px;padding:6px 8px;min-height:48px;align-items:center;overflow-y:hidden;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
  .tabs button{flex:none}
  button{font:inherit;font-size:13px;padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
  button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  button.warn{border-color:var(--accent2);color:var(--accent2)}
  button.sm{padding:5px 9px;font-size:12px}
  #stage{flex:1;position:relative;touch-action:none;background:var(--bg)}
  canvas{display:block;width:100%;height:100%}
  #lib{display:flex;gap:6px;padding:8px 8px 10px;min-height:84px;overflow-x:auto;white-space:nowrap;background:var(--panel);border-top:1px solid var(--line)}
  .item{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;min-width:74px;font-size:12px;cursor:pointer;background:var(--bg)}
  .item.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
  .item small{color:var(--muted);font-size:10px}
  .item i{display:block;width:28px;height:18px;border-radius:3px;border:1px solid #0003}
  #sel{display:none;gap:6px;padding:8px;background:var(--panel);border-top:1px solid var(--line);align-items:center;flex-wrap:wrap}
  #sel.on{display:flex}
  #sel .name{flex:1;font-size:13px;font-weight:600}
  #joy{position:absolute;left:18px;bottom:18px;width:120px;height:120px;border-radius:50%;background:rgba(127,127,127,.18);border:1px solid var(--line);display:none;z-index:4;touch-action:none}
  #joy i{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:var(--accent);opacity:.85}
  #walkHelp{position:absolute;right:12px;bottom:18px;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;display:none;z-index:4}
  #sheet{position:absolute;inset:auto 0 0 0;max-height:70%;overflow:auto;background:var(--panel);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:12px 14px 20px;display:none;z-index:5;box-shadow:0 -6px 24px #0002}
  #sheet.on{display:block}
  #sheet h2{font-size:15px;margin:0 0 8px}
  .row{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}
  .row label{font-size:13px;min-width:110px;color:var(--muted)}
  select,input[type=text],input[type=number]{font:inherit;font-size:13px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
  input[type=color]{width:40px;height:32px;border:1px solid var(--line);border-radius:8px;background:none;padding:0}
  table{border-collapse:collapse;width:100%;font-size:12.5px}
  td,th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:right}
  th{color:var(--muted);font-weight:600}
  .hint{position:absolute;top:8px;left:8px;right:8px;text-align:center;font-size:12px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 10px;pointer-events:none;opacity:.95}
  textarea{width:100%;height:120px;font:12px monospace;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
  .swatches{display:flex;gap:6px;flex-wrap:wrap}
  .sw{width:34px;height:34px;border-radius:8px;border:2px solid transparent;cursor:pointer}
  .sw.on{border-color:var(--accent)}
</style>
</head>

const ix = px => (px - view.ox)/view.s, iy = py => (view.oy - py)/view.s;

function rect(b, fill, stroke, lw){ const [x1,y1,x2,y2]=b; ctx.beginPath(); ctx.rect(X(x1), Y(y2), (x2-x1)*view.s, (y2-y1)*view.s); if (fill){ctx.fillStyle=fill; ctx.fill();} if (stroke){ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke();} }
function drawTiles(b, f){ if (!f.tile) return; const [x1,y1,x2,y2]=b; const tw=f.tile, th=f.tile2||f.tile; ctx.save(); ctx.beginPath(); ctx.rect(X(x1),Y(y2),(x2-x1)*view.s,(y2-y1)*view.s); ctx.clip(); ctx.strokeStyle="rgba(0,0,0,.12)"; ctx.lineWidth=1;
  for (let x=x1; x<x2; x+=tw){ ctx.beginPath(); ctx.moveTo(X(x),Y(y1)); ctx.lineTo(X(x),Y(y2)); ctx.stroke(); }
  for (let y=y1; y<y2; y+=th){ ctx.beginPath(); ctx.moveTo(X(x1),Y(y)); ctx.lineTo(X(x2),Y(y)); ctx.stroke(); } ctx.restore(); }
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,cv.width,cv.height);
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  // rooms (floors)
  for (const k of ROOM_ORDER){ const r = GEO.ROOMS[k]; const f = FLOORS.find(x=>x.id===S.finishes[k].floor)||FLOORS[0]; rect(r.box, k==="manwar" ? (dark?"#2a2a2a":"#dcdcdc") : f.c); if (k!=="manwar") drawTiles(r.box, f);
    // paint strip (room border) to show wall colour
    if (k!=="manwar" && k!=="balcony"){ ctx.save(); ctx.strokeStyle = S.finishes[k].paint; ctx.lineWidth = Math.max(3, 0.08*view.s); const [x1,y1,x2,y2]=r.box; ctx.strokeRect(X(x1)+ctx.lineWidth/2, Y(y2)+ctx.lineWidth/2, (x2-x1)*view.s-ctx.lineWidth, (y2-y1)*view.s-ctx.lineWidth); ctx.restore(); }
  }
  // walls
  for (const w of GEO.WALLS) rect(w, w[4]==="E" ? (dark?"#dcdcdc":"#1a1a1a") : (dark?"#8a8a8a":"#8d8d8d"));
  for (const w of GEO.LOW_WALLS) rect(w, dark?"#6a8aa8":"#9cbad6");
  for (const p of GEO.PARAPET) rect(p, dark?"#777":"#bbb");
  for (const c of GEO.COLUMNS) rect(c, dark?"#eee":"#000");
  // openings
  const op = (b, col) => rect(b, col);
  for (const d of Object.values(GEO.DOORS)) op(d.box, dark?"#1b1b1a":"#f4f2ee");
  op(GEO.ARCH.box, dark?"#1b1b1a":"#f4f2ee");
  for (const w of Object.values(GEO.WINDOWS)) { op(w.box, "#bfe3f5"); }
  // door swing lines (blue)
  ctx.strokeStyle = "#1f6fb2"; ctx.lineWidth = 1.5;
  for (const d of Object.values(GEO.DOORS)) { const [x1,y1,x2,y2]=d.box; ctx.beginPath(); if (x2-x1 > y2-y1) { ctx.moveTo(X(x1),Y(y1)); ctx.lineTo(X(x1),Y(y1+d.w)); ctx.arc(X(x1),Y(y1),d.w*view.s,-Math.PI/2,0); } else { ctx.moveTo(X(x1),Y(y1)); ctx.lineTo(X(x1+d.w),Y(y1)); ctx.arc(X(x1),Y(y1),d.w*view.s,0,-Math.PI/2,true);} ctx.stroke(); }
  // items
  for (const it of S.items) drawItem(it, it===sel);
  // room labels
  ctx.textAlign="center"; ctx.textBaseline="middle";
  for (const k of ROOM_ORDER){ const r=GEO.ROOMS[k]; const [x1,y1,x2,y2]=r.box; const cx=(x1+x2)/2, cy=(y1+y2)/2; const fs = Math.max(10, Math.min(16, view.s*0.22));
    ctx.font = `600 ${fs}px system-ui, sans-serif`; const t = r.name; const tw = ctx.measureText(t).width+10;
    ctx.fillStyle = dark?"rgba(36,36,35,.85)":"rgba(255,255,255,.85)"; ctx.fillRect(X(cx)-tw/2, Y(cy)-fs*0.75, tw, fs*1.5); ctx.fillStyle = dark?"#ececea":"#1d1d1b"; ctx.fillText(t, X(cx), Y(cy)); }
  // scale
  ctx.fillStyle = dark?"#ececea":"#1d1d1b"; ctx.fillRect(12, cv.height/dpr-18, view.s, 3); ctx.font="11px system-ui"; ctx.textAlign="left"; ctx.fillText("1 م", 12, cv.height/dpr-24);
}
function drawItem(it, on){
  const L = LIB.find(l=>l.id===it.t) || LIB[0]; const w = it.w ?? L.w, d = it.d ?? L.d; const rot = it.r||0;
  ctx.save(); ctx.translate(X(it.x), Y(it.y)); ctx.rotate(-rot*Math.PI/180);
  const pw = w*view.s, pd = d*view.s;
  if (L.pt) { // نقطة
    ctx.beginPath(); ctx.arc(0,0, Math.max(5, Math.min(pw, 14)), 0, Math.PI*2); ctx.fillStyle = L.c; ctx.fill(); ctx.strokeStyle = on?"#1f4e79":"#0006"; ctx.lineWidth = on?3:1; ctx.stroke();
    ctx.fillStyle="#000"; ctx.font="bold 9px system-ui"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText({light:"L",socket:"S",switch:"K",ac:"AC",data:"TV",cold:"C",hot:"H",drain:"D",floor:"F",gas:"G"}[L.pt]||"", 0, 0);
  } else {
    ctx.fillStyle = L.c; ctx.globalAlpha = L.ceil ? 0.6 : (L.wall && L.z ? 0.75 : 0.92);
    if (L.shape==="L") { ctx.beginPath(); ctx.moveTo(-pw/2,-pd/2); ctx.lineTo(pw/2,-pd/2); ctx.lineTo(pw/2,-pd/2+0.9*view.s); ctx.lineTo(-pw/2+0.9*view.s,-pd/2+0.9*view.s); ctx.lineTo(-pw/2+0.9*view.s,pd/2); ctx.lineTo(-pw/2,pd/2); ctx.closePath(); ctx.fill(); }
    else ctx.fillRect(-pw/2,-pd/2,pw,pd);
    ctx.globalAlpha = 1; ctx.strokeStyle = on?"#1f4e79":"#0008"; ctx.lineWidth = on?3:1; ctx.strokeRect(-pw/2,-pd/2,pw,pd);
    if (pw > 28 && pd > 14) { ctx.fillStyle="#000c"; ctx.font=`${Math.max(9,Math.min(12,pd*0.35))}px system-ui`; ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.rotate(rot*Math.PI/180); ctx.fillText(L.name, 0, -5); ctx.font="9px system-ui"; ctx.fillText(`${w.toFixed(2)}×${d.toFixed(2)}`, 0, 7); }
  }
  ctx.restore();
}
addEventListener('resize', fit);

// ===================== التفاعل =====================
const ptrs = new Map(); let drag = null, pinch = null, moved = false, downAt = 0;
function hit(x, y){ for (let i=S.items.length-1;i>=0;i--){ const it=S.items[i]; const L=LIB.find(l=>l.id===it.t); const w=it.w??L.w, d=it.d??L.d; const a=-(it.r||0)*Math.PI/180; const dx=x-it.x, dy=y-it.y; const lx=dx*Math.cos(-a)-dy*Math.sin(-a), ly=dx*Math.sin(-a)+dy*Math.cos(-a); const tol = L.pt ? 0.18 : 0.05; if (Math.abs(lx)<=w/2+tol && Math.abs(ly)<=d/2+tol) return it; } return null; }
function roomAt(x,y){ for (const k of ROOM_ORDER){ const [x1,y1,x2,y2]=GEO.ROOMS[k].box; if (x>=x1&&x<=x2&&y>=y1&&y<=y2) return k; } return null; }
const snap = v => Math.round(v*20)/20;
stage.addEventListener('pointerdown', e => { if (e.target!==cv) return; cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, {x:e.clientX,y:e.clientY}); moved=false; downAt=Date.now();
  if (ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y), cx:(a.x+b.x)/2, cy:(a.y+b.y)/2, s:view.s, ox:view.ox, oy:view.oy}; drag=null; return; }
  const r = cv.getBoundingClientRect(); const x = ix(e.clientX-r.left), y = iy(e.clientY-r.top);
  const h = hit(x,y);
  if (h){ sel = h; drag = {it:h, dx:h.x-x, dy:h.y-y}; showSel(); draw(); }
  else drag = {pan:true, x0:e.clientX, y0:e.clientY, ox:view.ox, oy:view.oy};
});
stage.addEventListener('pointermove', e => { if (!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if (pinch && ptrs.size===2){ const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); const k=d/pinch.d; const cx=(a.x+b.x)/2, cy=(a.y+b.y)/2; const r=cv.getBoundingClientRect();
    view.s = Math.min(400, Math.max(20, pinch.s*k)); const kk = view.s/pinch.s; view.ox = (cx-r.left) - ((pinch.cx-r.left)-pinch.ox)*kk + (cx-pinch.cx)*0; view.oy = (cy-r.top) - ((pinch.cy-r.top)-pinch.oy)*kk; moved=true; draw(); return; }
  if (!drag) return; const r = cv.getBoundingClientRect();
  if (drag.pan){ if (Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)>4) moved=true; view.ox = drag.ox + (e.clientX-drag.x0); view.oy = drag.oy + (e.clientY-drag.y0); draw(); }
  else { const x = ix(e.clientX-r.left), y = iy(e.clientY-r.top); drag.it.x = snap(x+drag.dx); drag.it.y = snap(y+drag.dy); moved=true; draw(); }
});
function up(e){ ptrs.delete(e.pointerId); if (ptrs.size<2) pinch=null;
  if (drag && !drag.pan && moved) save();
  if (drag && drag.pan && !moved && Date.now()-downAt < 500){ // tap on empty space
    const r = cv.getBoundingClientRect(); const x = ix(e.clientX-r.left), y = iy(e.clientY-r.top);
    if (tool){ const L = LIB.find(l=>l.id===tool); S.items.push({id:Date.now().toString(36), t:tool, x:snap(x), y:snap(y), r:0}); sel = S.items[S.items.length-1]; save(); showSel(); draw(); }
    else { const k = roomAt(x,y); if (k && k!=="manwar") openRoom(k); else { sel=null; showSel(); draw(); } }
  }
  drag=null; }
stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
stage.addEventListener('wheel', e => { e.preventDefault(); const r=cv.getBoundingClientRect(); const k = e.deltaY<0?1.1:1/1.1; const px=e.clientX-r.left, py=e.clientY-r.top; view.ox = px - (px-view.ox)*k; view.oy = py - (py-view.oy)*k; view.s*=k; draw(); }, {passive:false});

// ===================== المكتبة والتبويبات =====================
const tabs = document.getElementById('tabs'), lib = document.getElementById('lib');
function renderTabs(){ tabs.innerHTML=""; for (const c of CATS){ const b=document.createElement('button'); b.textContent=c; b.className = c===cat?"on":""; b.onclick=()=>{cat=c; tool=null; renderTabs(); renderLib();}; tabs.appendChild(b); }
  const b2=document.createElement('button'); b2.textContent = showPts ? "إخفاء النقط" : "إظهار النقط"; b2.onclick=()=>{showPts=!showPts; renderTabs(); draw();}; tabs.appendChild(b2); }
function renderLib(){ lib.innerHTML=""; for (const L of LIB.filter(l=>l.cat===cat)){ const d=document.createElement('div'); d.className="item"+(tool===L.id?" on":""); d.innerHTML=`<i style="background:${L.c}"></i><span>${L.name}</span><small>${L.pt?"نقطة":(L.w.toFixed(2)+"×"+L.d.toFixed(2))}</small>`; d.onclick=()=>{ tool = tool===L.id ? null : L.id; renderLib(); document.getElementById('hint').textContent = tool ? `اضغط في المخطط مكان: ${L.name}` : "اختار عنصر من تحت ثم اضغط مكانه في المخطط"; }; lib.appendChild(d); } }
renderTabs(); renderLib();

// ===================== الكميات =====================
const H = 3.00;
function perim(b){ const [x1,y1,x2,y2]=b; return 2*((x2-x1)+(y2-y1)); }
function openings(k){ // مساحة الفتحات على حوائط الغرفة (تقريبي: تُنسب الفتحة للغرفة التي تلامس صندوقها)
  let a=0, pr=0; const [x1,y1,x2,y2]=GEO.ROOMS[k].box; const touch=b=>!(b[2]<x1-0.11||b[0]>x2+0.11||b[3]<y1-0.11||b[1]>y2+0.11);
  for (const d of Object.values(GEO.DOORS)) if (touch(d.box)) { a+=d.w*2.2; pr+=d.w; }
  if (touch(GEO.ARCH.box)) { a+=1.35*2.4; pr+=1.35; }
  for (const w of Object.values(GEO.WINDOWS)) if (touch(w.box)) { const [ww,hh]=w.size.split("×").map(Number); a+=ww*hh; }
  return {a, pr}; }
function quantities(){
  const rows=[]; let floors={}, wallTile=0, paint=0, plaster=0, ceil=0, gyps=0, skirting=0;
  for (const k of ROOM_ORDER){ if (k==="manwar") continue; const r=GEO.ROOMS[k]; const [x1,y1,x2,y2]=r.box; const area=(x2-x1)*(y2-y1); const f=S.finishes[k]; const F=FLOORS.find(x=>x.id===f.floor);
    floors[F.name]=(floors[F.name]||0)+area;
    if (k==="balcony"){ rows.push([r.name, area.toFixed(2), "—", "—", "—"]); continue; }
    const op=openings(k); const P=perim(b=r.box); const walls=P*H-op.a; const tileA=Math.max(0, P*f.tileH - (f.tileH>0 ? op.a*Math.min(1,f.tileH/2.2) : 0));
    const paintA=Math.max(0, walls-tileA); wallTile+=tileA; paint+=paintA; plaster+=walls; ceil+=area; if (f.ceilType==="gypsum") gyps+=area; if (f.tileH===0) skirting+=P-op.pr;
    rows.push([r.name, area.toFixed(2), tileA.toFixed(1), paintA.toFixed(1), F.name]); }
  const cnt={}; for (const it of S.items){ const L=LIB.find(l=>l.id===it.t); cnt[L.name]=(cnt[L.name]||0)+1; }
  const pts={}; for (const it of S.items){ const L=LIB.find(l=>l.id===it.t); if (L.pt) pts[L.pt]=(pts[L.pt]||0)+1; }
  const elecApp = S.items.filter(it=>LIB.find(l=>l.id===it.t).elec).length, plumbApp = S.items.filter(it=>LIB.find(l=>l.id===it.t).plumb).length;
  return {rows, floors, wallTile, paint, plaster, ceil, gyps, skirting, cnt, pts, elecApp, plumbApp}; }

  const ptName={light:"نقط إضاءة",socket:"برايز",switch:"مفاتيح",ac:"نقط تكييف",data:"تلفزيون/نت",cold:"تغذية بارد",hot:"تغذية ساخن",drain:"صرف",floor:"بلاعات",gas:"غاز"};

  <tr><td>أجهزة تحتاج كهرباء</td><td>${q.elecApp}</td></tr><tr><td>عناصر تحتاج سباكة</td><td>${q.plumbApp}</td></tr></table>

document.getElementById('bSave').onclick=()=>{ const js=JSON.stringify(S);
  openSheet(`<h2>حفظ / تصدير</h2>

  <textarea id="ta" readonly>${js.replace(/</g,"&lt;")}</textarea>
  <h2 style="margin-top:10px">استيراد</h2>
  <div class="row"><input type="file" id="imp" accept=".json,application/json"><button id="paste">لصق من النص</button></div>
  <textarea id="tin" placeholder="الصق JSON هنا ثم اضغط لصق من النص"></textarea>

// ===================== عرض 3D (إسقاط محوري على Canvas – بدون WebGL) =====================

function shade(hex, f){ const n=parseInt(hex.slice(1),16); const r=Math.min(255,Math.max(0,((n>>16)&255)*f)), g=Math.min(255,Math.max(0,((n>>8)&255)*f)), b=Math.min(255,Math.max(0,(n&255)*f)); return `rgb(${r|0},${g|0},${b|0})`; }

      const fs=boxFaces(it.x-0.06,it.y-0.06,it.x+0.06,it.y+0.06, L.ceil?2.9:(z0||0.3), L.ceil?3.0:(z0||0.3)+0.12, L.c); items.push({faces:fs,d:Math.min(...fs.map(f=>f.d))}); continue; }

const draw2d = draw;

function setMode(m){ mode3d = m; if (!m && walk) setWalk(false); document.getElementById('bWalk').style.display = m?"":"none"; document.getElementById('b2d').classList.toggle('on',!m); document.getElementById('b3d').classList.toggle('on',m); document.getElementById('bCut3').style.display = m?"":"none"; document.getElementById('lib').style.display = m?"none":""; document.getElementById('tabs').style.display = m?"none":""; if (m) { sel=null; showSel(); } document.getElementById('hint').textContent = m ? "اسحب للدوران · إصبعين للتقريب · التعديل من وضع 2D وبيظهر هنا فورًا" : "اختار عنصر من تحت ثم اضغط مكانه في المخطط · إصبعين للتكبير والسحب · اضغط على اسم غرفة لتشطيبها"; if (m) fit3d(); else fit(); draw(); }

const joy=document.getElementById('joy'), joyKnob=joy.querySelector('i'), walkHelp=document.getElementById('walkHelp');
function roomName(x,y){ const k=roomAt(x,y); return k?GEO.ROOMS[k].name:"خارج الشقة"; }
function camT(x,y,z){ const yw=P.yaw*Math.PI/180, pt=P.pitch*Math.PI/180; const dx=x-P.x, dy=y-P.y, dz=z-P.z; const fx=Math.sin(yw), fy=Math.cos(yw); const rx=Math.cos(yw), ry=-Math.sin(yw);

  push([[...c[0],z0],[...c[3],z0],[...c[2],z0],[...c[1],z0]], 0.9);           // bottom
  for (let i=0;i<4;i++){ const A=c[i], B=c[(i+1)%4]; push([[...A,z0],[...B,z0],[...B,z1],[...A,z1]], (Math.abs(B[0]-A[0])>Math.abs(B[1]-A[1]))?0.88:0.76); }

function drawWalk(){
  ctx.setTransform(dpr,0,0,dpr,0,0); const W=cv.width/dpr, Hh=cv.height/dpr; const focal=(W/2)/Math.tan(70*Math.PI/360);

    for (let x=x1; x<x2; x+=1.0) for (let y=y1; y<y2; y+=1.0){ const fx=Math.min(x+1,x2), fy=Math.min(y+1,y2); faces.push(...facesOfBox(x,y,fx,fy,-0.1,0,col)); if (k!=="manwar"&&k!=="balcony") faces.push(...facesOfBox(x,y,fx,fy,3.0,3.08,pc)); } }

function blocked(x,y){ const r=0.22; for (const b of WALLS3D){ const [x1,y1,x2,y2,z0,z1]=b; if (z0>1.5 || z1<0.4) continue; if (x>x1-r&&x<x2+r&&y>y1-r&&y<y2+r) return true; }

let lastT=0;
function step(t){ if (!walk) return; const dt=Math.min(0.05,(t-lastT)/1000||0.016); lastT=t;

// joystick

stage.addEventListener('wheel', e => { if (!mode3d) return; e.stopImmediatePropagation(); e.preventDefault(); const k=e.deltaY<0?1.1:1/1.1; const r=cv.getBoundingClientRect(); const px=e.clientX-r.left, py=e.clientY-r.top; cam.ox = px-(px-cam.ox)*k; cam.oy = py-(py-cam.oy)*k; cam.s*=k; draw(); }, {passive:false, capture:true});

document.getElementById('bFit').onclick=()=>fit();
fit();
</script>
<script>if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
